name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run flake8
        run: flake8 .

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret
          DATABASE_URL: "sqlite:///:memory:"
          FLASK_DEBUG: "False"
        run: pytest
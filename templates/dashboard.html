{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
    <h1>Dashboard</h1>

    <p>Total applications: <strong>{{ total }}</strong></p>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Status</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody>
            {% for status, count in status_counts.items() %}
            <tr>
                <td>{{ status }}</td>
                <td>{{ count }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <p><a href="{{ url_for('home') }}">&larr; Back to all applications</a></p>
{% endblock %}
